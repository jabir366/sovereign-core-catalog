# Default values for postgres-s390x chart
nameOverride: ""
fullnameOverride: ""

namespaceOverride: ""

commonLabels:
  app: postgres-s390x
  service-type: postgres-s390x
commonAnnotations: {}

instance:
  name: ""
  id: ""
  environment: ""
  clusterName: ""

# Official s390x-specific PostgreSQL image from Docker Hub
# Tags: https://hub.docker.com/r/s390x/postgres/tags
image:
  registry: ""
  repository: s390x/postgres
  tag: "17.11"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 5432
  clusterIP: None

statefulset:
  replicas: 1

auth:
  superuserPassword: "change-me-superuser-password"
  database: "appdb"
  username: "appuser"
  password: "change-me-password"

pgConfig: {}
  # max_connections: "100"
  # shared_buffers: "128MB"

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi

container:
  name: postgres
  resources: {}

probes:
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5

