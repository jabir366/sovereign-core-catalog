{{- $instanceName := default .Release.Name .Values.instance.name -}}
{{- $secretName := printf "postgres-s390x-%s" $instanceName -}}
{{- $namespace := default .Release.Namespace .Values.namespaceOverride -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  labels:
    app: {{ .Values.commonLabels.app | quote }}
    service-type: {{ index .Values.commonLabels "service-type" | quote }}
    instance: {{ $instanceName | quote }}
    managed-by: byop-broker
    {{- range $key, $value := .Values.commonLabels }}
    {{- if and (ne $key "app") (ne $key "service-type") }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
  annotations:
    byop.ibm.com/instance-id: {{ .Values.instance.id | quote }}
    byop.ibm.com/service-type: "postgres-s390x"
    byop.ibm.com/cluster: {{ .Values.instance.clusterName | quote }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  superuser-password: {{ .Values.auth.superuserPassword | quote }}
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
  database: {{ .Values.auth.database | quote }}
  connection-string: {{ printf "postgresql://%s:%s@postgres-s390x-%s:5432/%s" .Values.auth.username .Values.auth.password $instanceName .Values.auth.database | quote }}
  jdbc-url: {{ printf "jdbc:postgresql://postgres-s390x-%s:5432/%s" $instanceName .Values.auth.database | quote }}

