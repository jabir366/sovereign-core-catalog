{{- $root := . }}
{{- if .Values.ha.enabled }}
{{- /*
  HA mode: render one DataVolume per replica set member.
  Names: <fullname>-0-disk, <fullname>-1-disk, …
*/ -}}
{{- range $i := until (int .Values.ha.replicaCount) }}
{{- $ctx := dict "Values" $root.Values "Chart" $root.Chart "Release" $root.Release "index" $i }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: {{ include "mongodb-vm.memberDvName" $ctx }}
  namespace: {{ $root.Values.namespaceOverride | default $root.Release.Namespace }}
  labels:
    {{- include "mongodb-vm.labels" $root | nindent 4 }}
    mongodb-vm/member-index: {{ $i | quote }}
  annotations:
    {{- include "mongodb-vm.annotations" $root | nindent 4 }}
spec:
  {{- if $root.Values.diskImage.sourceContainerDisk }}
  source:
    registry:
      url: "docker://{{ $root.Values.diskImage.sourceContainerDisk }}"
      {{- if $root.Values.diskImage.pullSecret }}
      secretRef: {{ $root.Values.diskImage.pullSecret | quote }}
      {{- end }}
      {{- if $root.Values.diskImage.certConfigMap }}
      certConfigMap: {{ $root.Values.diskImage.certConfigMap | quote }}
      {{- end }}
  {{- else if $root.Values.diskImage.sourceURL }}
  source:
    http:
      url: {{ $root.Values.diskImage.sourceURL | quote }}
  {{- else if $root.Values.diskImage.sourcePVCName }}
  source:
    pvc:
      name: {{ $root.Values.diskImage.sourcePVCName | quote }}
      namespace: {{ $root.Values.diskImage.sourcePVCNamespace | default $root.Release.Namespace | quote }}
  {{- else }}
  {{- fail "One of diskImage.sourceContainerDisk, diskImage.sourceURL, or diskImage.sourcePVCName must be set" }}
  {{- end }}
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ $root.Values.diskImage.diskSizeGi }}Gi
    storageClassName: {{ $root.Values.diskImage.storageClassName | quote }}
    volumeMode: Block
{{- end }}
{{- else }}
{{- /*
  Standalone mode: single DataVolume (original behaviour).
*/ -}}
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: {{ include "mongodb-vm.dvName" . }}
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "mongodb-vm.labels" . | nindent 4 }}
  annotations:
    {{- include "mongodb-vm.annotations" . | nindent 4 }}
spec:
  {{- if .Values.diskImage.sourceContainerDisk }}
  source:
    registry:
      url: "docker://{{ .Values.diskImage.sourceContainerDisk }}"
      {{- if .Values.diskImage.pullSecret }}
      secretRef: {{ .Values.diskImage.pullSecret | quote }}
      {{- end }}
      {{- if .Values.diskImage.certConfigMap }}
      certConfigMap: {{ .Values.diskImage.certConfigMap | quote }}
      {{- end }}
  {{- else if .Values.diskImage.sourceURL }}
  source:
    http:
      url: {{ .Values.diskImage.sourceURL | quote }}
  {{- else if .Values.diskImage.sourcePVCName }}
  source:
    pvc:
      name: {{ .Values.diskImage.sourcePVCName | quote }}
      namespace: {{ .Values.diskImage.sourcePVCNamespace | default .Release.Namespace | quote }}
  {{- else }}
  {{- fail "One of diskImage.sourceContainerDisk, diskImage.sourceURL, or diskImage.sourcePVCName must be set" }}
  {{- end }}
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ .Values.diskImage.diskSizeGi }}Gi
    storageClassName: {{ .Values.diskImage.storageClassName | quote }}
    volumeMode: Block
{{- end }}
