apiVersion: sovereign-catalog.io/v1alpha1
kind: SoftwareListing
metadata:
  companyRef: "companies/open-source"
  vendor: "MongoDB, Inc."
  product: "MongoDB Enterprise Advanced VM"
  shortDescription: "Enterprise-grade MongoDB document database deployed as an OCP Virt VirtualMachine on IBM Z (s390x) with standalone and HA replica set support."
  fullDescription: "MongoDB Enterprise Advanced 8.3.17 deployed as an OpenShift Virtualization (OCP Virt) VirtualMachine on IBM Z architecture (s390x). The boot disk is a bootc-built (RHEL Image Mode) OCI-native qcow2 produced by securedimage/build.sh on the s390x LPAR. First-boot credential injection and mongod configuration are handled via cloud-init write_files + runcmd. Supports single VM standalone deployments and 3-member Replica Sets with pod anti-affinity. Compliance controls Phase 1 (NetworkPolicy, ServiceAccount RBAC, encrypted storage class) and Phase 2 (WiredTiger encryption-at-rest, MongoDB audit log) are enforced at chart and runtime layers. FIPS-compliant SCRAM-SHA-256 authentication is enforced throughout."
  sovereignCoreRelevance: "Enables air-gapped, on-premises deployment of MongoDB Enterprise Advanced on IBM Z s390x virtualized infrastructure, ensuring confidential computing and data sovereignty within regulated environments."
  category: "data"
  industries: ["government", "bfsi", "healthcare", "telco", "energy"]
  intendedUsers: ["Database administrators", "Application developers", "Platform engineers"]
  version: "8.3.17"
  lifecycleStatus: "approved"
  storefrontVisibility: "public"
  availabilityState: "available_central_it"
spec:
  jurisdiction:
    hq: "USA"
    ultimateParentCompanyHQ: "USA"
  openSource:
    enabled: false
    license: "SSPL-1.0"
    upstreamProject: "https://github.com/mongodb/mongo"
    upstreamVersion: "8.3.17"
  architecture:
    format: "VM"
    airgapReady: true
    dependencyEndpoints: []
    storage:
      csiAccessModes: ["ReadWriteOnce"]
      volumeSnapshotSupport: true
  security:
    podSecurityStandard: "baseline"
    requiresClusterAdmin: false
    readOnlyRootFilesystem: false
    kmsIntegration: false
  deployment:
    type: "Helm"
    repository: "oci://quay.io/mongodbhelm/mongodb-vm"
  catalog:
    brokerType: "platform"
    sourceType: "helm-registry"
    sourceRepo: "oci://quay.io/mongodbhelm/mongodb-vm"
    sourceVersion: "1.1.0"
    name: "mongodbvm"
  links:
    docsUrl: "https://www.mongodb.com/docs/manual/"
    productPageUrl: "https://www.mongodb.com/products/self-managed/enterprise-advanced"
