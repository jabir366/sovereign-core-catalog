apiVersion: sovereign-catalog.io/v1alpha1
kind: SoftwareListing
metadata:
  companyRef: "companies/open-source"
  vendor: "MongoDB, Inc."
  product: "MongoDB Enterprise Advanced VM"
  shortDescription: "Enterprise-grade MongoDB document database deployed as an OCP Virt VirtualMachine on IBM Z (s390x) with support for standalone and high-availability replica set architectures."
  fullDescription: "MongoDB Enterprise Advanced deployed as an OpenShift Virtualization (OCP Virt) VirtualMachine on IBM Z architecture (s390x). Running on pre-baked enterprise Linux images with automated first-boot credential provisioning and cloud-init configuration, it delivers high performance NoSQL document storage for sovereign enterprise workloads. Supports single VM standalone deployments as well as multi-node Replica Sets with pod anti-affinity across s390x compute nodes."
  sovereignCoreRelevance: "Enables air-gapped, on-premises deployment of MongoDB Enterprise Advanced on IBM Z s390x virtualized infrastructure, ensuring confidential computing and data sovereignty within regulated environments."
  category: "data"
  industries: ["government", "bfsi", "healthcare", "telco", "energy"]
  intendedUsers: ["Database administrators", "Application developers", "Platform engineers"]
  version: "8.3.2"
  lifecycleStatus: "approved"
  storefrontVisibility: "public"
  availabilityState: "available_central_it"
spec:
  openSource:
    enabled: true
    license: "SSPL-1.0"
    upstreamProject: "https://github.com/mongodb/mongo"
    upstreamVersion: "8.3.2"
  architecture:
    format: "Kubernetes"
    airgapReady: true
    dependencyEndpoints: []
    storage:
      csiAccessModes: ["ReadWriteOnce"]
      volumeSnapshotSupport: true
  security:
    podSecurityStandard: "baseline"
    requiresClusterAdmin: false
    readOnlyRootFilesystem: false
    kmsIntegration: false
  deployment:
    type: "Helm"
    repository: "oci://quay.io/mongodbhelm/mongodb-vm:1.0.0"
  catalog:
    brokerType: "platform"
    sourceType: "helm-registry"
    sourceRepo: "oci://quay.io/mongodbhelm/mongodb-vm"
    name: "mongodbvm"
  links:
    docsUrl: "https://www.mongodb.com/docs/manual/"
    productPageUrl: "https://www.mongodb.com/products/self-managed/enterprise-advanced"
brokerType: "platform"
sourceType: "helm-registry"
sourceRepo: "oci://quay.io/mongodbhelm/mongodb-vm"
name: "mongodbvm"
